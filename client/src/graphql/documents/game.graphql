query activeGameId {
  activeGameId
}

query games {
  games {
    id
    winnerUserId
    startedAt
    endedAt
    gameUsers {
      userId
      user {
        displayName
      }
    }
  }
}

query game($id: Int!) {
  game(id: $id) {
    id
    turnUserId
    phase
    winnerUserId
    startedAt
    endedAt
    gameUsers {
      ...GameUser
    }
    gameCards {
      ...GameCard
    }
    gameLogs {
      ...GameLog
    }
  }
}

mutation startGame($deckId: Int!) {
  startGame(deckId: $deckId) {
    id
  }
}

mutation dispatchGameAction($id: Int!, $data: GameActionDispatchInput!) {
  dispatchGameAction(id: $id, data: $data) {
    id
  }
}

fragment GameCard on GameCard {
  id
  originalUserId
  currentUserId
  zone
  position
  battlePosition
  name
  kind
  type
  attribute
  attack
  defence
  cost
  detail
  actionTypes
  card {
    id
    picture
  }
}

fragment GameLog on GameLog {
  id
  gameId
  message
  createdAt
}

fragment GameUser on GameUser {
  id
  userId
  user {
    displayName
    photoURL
  }
  energy
  lifePoint
  lastViewedAt
  actionTypes
}
