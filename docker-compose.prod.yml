# docker compose -f docker-compose.prod.yml --env-file client/.env.production build
# docker compose -f docker-compose.prod.yml push

version: "3"

services:
  server:
    platform: linux/amd64
    build:
      context: .
      dockerfile: server/Dockerfile
    image: solt9029/soulmonsters-server:latest

  client:
    platform: linux/amd64
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_HTTP_LINK_URI: ${VITE_HTTP_LINK_URI}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_DATABASE_URL: ${VITE_FIREBASE_DATABASE_URL}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
        VITE_FIREBASE_MEASUREMENT_ID: ${VITE_FIREBASE_MEASUREMENT_ID}
        NGINX_BASIC_AUTH_USER: ${NGINX_BASIC_AUTH_USER}
        NGINX_BASIC_AUTH_PASS: ${NGINX_BASIC_AUTH_PASS}
    image: solt9029/soulmonsters-client:latest
