name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: soulmonsters_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Configure MySQL charset
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client
          mysql -h 127.0.0.1 -P 3307 -u root -proot -e "DROP DATABASE IF EXISTS soulmonsters_test;"
          mysql -h 127.0.0.1 -P 3307 -u root -proot -e "CREATE DATABASE soulmonsters_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      - name: Run database migrations
        run: cd server && yarn db:migrate
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 3307
          DB_USERNAME: root
          DB_PASSWORD: root
          DB_DATABASE: soulmonsters_test
          DB_TYPE: mysql

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Optional: Specify model (defaults to Claude Sonnet 4, uncomment for Claude Opus 4)
          # model: "claude-opus-4-20250514"
          
          # Optional: Customize the trigger phrase (default: @claude)
          # trigger_phrase: "/claude"
          
          # Optional: Trigger when specific user is assigned to an issue
          # assignee_trigger: "claude-bot"
          
          # Optional: Allow Claude to run specific commands
          allowed_tools: "Bash(yarn install),Bash(yarn workspace soulmonsters-server test),Bash(yarn workspace soulmonsters-server format),Bash(yarn workspace soulmonsters-client format),Bash(yarn format),Bash(yarn test),Bash(yarn generate-graphql-types)"
          
          # Optional: Add custom instructions for Claude to customize its behavior for your project
          # custom_instructions: |
          #   Follow our coding standards
          #   Ensure all new code has tests
          #   Use TypeScript for new files
          
          # Optional: Custom environment variables for Claude
          claude_env: |
            NODE_ENV: test
            DB_HOST: localhost
            DB_PORT: 3307
            DB_USERNAME: root
            DB_PASSWORD: root
            DB_DATABASE: soulmonsters_test
            DB_TYPE: mysql
